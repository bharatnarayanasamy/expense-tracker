[project]
name = "expense-tracker"
version = "0.1.0"
description = "Local PDF bank statement expense tracker with categorization and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.12.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:app"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["expense_tracker*"]

[tool.setuptools.package-data]
expense_tracker = ["static/**/*"]
