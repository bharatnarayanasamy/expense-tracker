    category: Utilities
  # Money in from people (split bills, paybacks)
  - match: Zelle payment from
    category: Income
  - match: "regex: Zelle payment to .+[Dd]inner"
    category: Food
  - match: "regex: Zelle payment to .+[Ff]ood"
    category: Food
  # Real P2P out (not moving money between your own accounts)
  - match: PMNT SENT
    category: Other
  - match: VENMO DES:PURCHASE
    category: Other
  - match: Zelle payment to
    category: Other
  # Paying credit cards or moving between your accounts — exclude from spend
  - match: ONLINE/MOBILE RECURRING FROM CHK
    category: Transfer
  - match: RECURRING FROM CHK
    category: Transfer
  - match: PAYMENT FROM CHK
    category: Transfer
  - match: PAYMENT THANK YOU
    category: Transfer
  - match: AUTOMATIC PAYMENT
    category: Transfer
  - match: AUTOPAY
    category: Transfer
